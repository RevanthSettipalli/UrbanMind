version: "3.9"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: urbanmind-zookeeper
    restart: always

    ports:
      - "22181:2181"

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000


  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: urbanmind-kafka
    restart: always

    depends_on:
      zookeeper:
        condition: service_started

    ports:
      - "19092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: urbanmind-zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://urbanmind-kafka:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_NUM_PARTITIONS: 1


  postgres:
    image: postgres:16

    container_name: urbanmind-postgres

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: urbanmind
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123


  producer:

    build:
      context: .

    container_name: urbanmind-producer

    restart: always

    depends_on:
      kafka:
        condition: service_started

    environment:
      KAFKA_BOOTSTRAP_SERVERS: urbanmind-kafka:9092

    volumes:
      - .:/app

    working_dir: /app

    command: python backend/streaming/weather_producer.py


  consumer:

    build:
      context: .

    container_name: urbanmind-consumer

    restart: always

    depends_on:
      kafka:
        condition: service_started

    environment:
      KAFKA_BOOTSTRAP_SERVERS: urbanmind-kafka:9092

    volumes:
      - .:/app

    working_dir: /app

    command: python backend/streaming/weather_consumer.py


  urbanmind:

    build:
      context: .

    container_name: urbanmind-dashboard

    restart: always

    depends_on:
      kafka:
        condition: service_started

      postgres:
        condition: service_started

    ports:
      - "8501:8501"

    environment:
      KAFKA_BROKER: urbanmind-kafka:9092
      DB_HOST: urbanmind-postgres

    volumes:
      - .:/app

    working_dir: /app

    command: streamlit run frontend/home.py --server.port=8501 --server.address=0.0.0.0